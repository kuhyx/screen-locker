name: workout_app
description: "Workout tracker replacing StrongLifts"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.4.0
  crdt_sync:
    git:
      url: https://github.com/kuhyx/utils
      ref: crdt_sync_dart-v0.10.0
      path: crdt_sync_dart
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1

  # One-tap sign-in for the sync account. App-side only: crdt_sync stays pure
  # Dart so it keeps working on Linux desktop and headless.
  google_sign_in: ^7.2.0
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  sync_settings_ui:
    git:
      url: https://github.com/kuhyx/utils
      ref: sync_settings_ui-v0.1.0
      path: sync_settings_ui
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  vibration: ^3.1.0

dev_dependencies:
  audioplayers_platform_interface: ^7.1.1
  # Generates the Android launcher icons from assets/icon/ (see
  # python_pkg/app_icons in testsAndMisc for the shared style).
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.1
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/break_end.mp3

# Launcher icon generation. Source art is produced by the shared generator:
#   PYTHONPATH=~/testsAndMisc python3 -m python_pkg.app_icons generate --app <key>
# then run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#211D1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21
