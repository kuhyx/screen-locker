name: workout_app
description: "Workout tracker replacing StrongLifts"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: 6.8.1
  crdt_sync:
    git:
      url: https://github.com/kuhyx/utils
      ref: crdt_sync_dart-v0.11.1
      path: crdt_sync_dart
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.0.0

  # One-tap sign-in for the sync account. App-side only: crdt_sync stays pure
  # Dart so it keeps working on Linux desktop and headless.
  google_sign_in: 7.2.0
  http: 1.6.0
  path: 1.9.1
  path_provider: 2.1.6
  permission_handler: 13.0.1
  shared_preferences: 2.5.5
  sqflite: 2.4.3
  # Linux desktop has no sqflite plugin; the FFI factory drives the same
  # schema (and already backed the test suite before the desktop target).
  sqflite_common_ffi: 2.4.2+1
  sync_settings_ui:
    git:
      url: https://github.com/kuhyx/utils
      ref: sync_settings_ui-v0.4.1
      path: sync_settings_ui
  url_launcher: 6.3.2
  uuid: 4.6.0
  vibration: 3.2.0

dev_dependencies:
  audioplayers_platform_interface: 7.2.0
  # Generates the Android launcher icons from assets/icon/ (see
  # python_pkg/app_icons in testsAndMisc for the shared style).
  flutter_launcher_icons: 0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/break_end.mp3

# Launcher icon generation. Source art is produced by the shared generator:
#   PYTHONPATH=~/testsAndMisc python3 -m python_pkg.app_icons generate --app <key>
# then run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#211D1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21
