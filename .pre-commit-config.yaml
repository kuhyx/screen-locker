# Pre-commit Configuration for screen-locker
# Install:  pre-commit install && pre-commit install --hook-type pre-push
# Run:      pre-commit run --all-files
# Update:   pre-commit autoupdate

default_language_version:
  python: python3
default_stages: [pre-commit]
fail_fast: false

default_install_hook_types: [pre-commit, pre-push, post-commit, post-merge, post-rewrite]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # run_tcx holds byte-exact RunnerUp exports; the golden test compares the
      # encoder's output with them, so the fixers must never rewrite them.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^screen_locker/tests/fixtures/run_tcx/
      - id: end-of-file-fixer
        exclude: ^screen_locker/tests/fixtures/run_tcx/
      - id: check-yaml
        # pnpm-lock.yaml is a two-document stream by design.
        exclude: ^web/pnpm-lock\.yaml$
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-ast
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: requirements-txt-fixer

  - repo: local
    hooks:
      - id: repo-contract
        name: repo contract (CLAUDE.md Commands + test_changed)
        entry: scripts/check_repo_contract.sh
        language: system
        pass_filenames: false
        files: ^(CLAUDE\.md|AGENTS\.md|scripts/test_changed\.sh)$|(^|/)(AndroidManifest\.xml|build\.gradle(\.kts)?|strings\.xml|pubspec\.yaml|repo-contract\.toml|[^/]+\.desktop|assets/icon/[^/]+\.png)$
      - id: no-noqa
        name: Block noqa comments
        entry: '(?i)#\s*(noqa|type:\s*ignore)'
        language: pygrep
        types: [python]
      - id: no-ruff-noqa
        name: Block ruff noqa file-level comments
        entry: '(?i)#\s*ruff:\s*noqa'
        language: pygrep
        types: [python]
      - id: requirements-sync
        name: requirements.txt covers all package imports
        # scripts/ became a real package (it now holds shared helpers), so
        # auto-detection sees two candidates -- name the one that ships.
        entry: python3 scripts/check_requirements_sync.py --package screen_locker
        language: system
        pass_filenames: false
        files: ^(screen_locker/.*\.py|requirements\.txt)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      # The CI mirror, one step per hook so each call stays under the 60 s
      # action cap. Order matters: ci-venv (re)builds .ci-mirror-venv from
      # requirements.txt when it changed, so ci-pytest only reuses it.
      # `pre-commit run --all-files` is split into four ci-precommit-* steps
      # (each well under the cap); together they run every default-stage hook
      # exactly once -- see run_precommit_group in scripts/ci_mirror.sh.
      - id: ci-venv
        name: CI mirror (clean requirements.txt venv)
        entry: bash scripts/ci_mirror.sh venv
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-precommit-rest
        name: "CI mirror (pre-commit --all-files: every other hook)"
        entry: bash scripts/ci_mirror.sh precommit rest
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-pytest
        name: CI mirror (clean-venv pytest, xdist)
        entry: bash scripts/ci_mirror.sh pytest
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

  - repo: local
    hooks:
      # Fails a commit that still points crdt_sync at a local path. Local
      # tests would go green against a library CI has never seen, silently.
      - id: crdt-sync-override
        name: no local crdt_sync dependency_override
        entry: bash scripts/check_no_crdt_sync_override.sh stronglift_replacement/workout_app/pubspec.yaml
        language: system
        pass_filenames: false
        always_run: true
      - id: no-silent-failures
        name: Block silent failures (swallowed exceptions and silent sys.exit(0) must say why)
        entry: python3 -m scripts.check_silent_failures
        language: system
        types: [python]
      - id: no-silent-failures-dart
        # The Python hook above is types:[python] and so had never looked at a
        # single Dart file — in the app where a swallowed sync error costs the
        # user a workout with nothing anywhere saying so.
        name: Block silent failures in Dart (swallowed errors must log why)
        entry: python3 -m scripts.check_silent_failures_dart
        language: system
        types: [dart]
      - id: screens-fit
        name: Every lock screen fits 1366x768 (no scrolling required)
        entry: python3 -m scripts.verify_screen_fits
        language: system
        files: '^screen_locker/.*\.py$'
        pass_filenames: false
        require_serial: true
      - id: text-free
        name: No locker screen paints a word (textgate)
        entry: python3 -m scripts.verify_text_free
        language: system
        files: '^(screen_locker|scripts)/.*\.py$'
        pass_filenames: false
        require_serial: true

      # Four markdown namespaces (README / CLAUDE* / DOCS* / TODO*), plus the
      # rule that a TODO carries "REMOVE ME AFTER FINISH" and nothing else may.
      # Shared gate in ~/src/utils owns the namespaces and the exemption list, so
      # one repo's idea of a valid name cannot drift from every other repo's.
      - id: md-naming
        name: markdown naming convention
        entry: scripts/check_md_naming.sh
        language: system
        files: \.(md|markdown)$

      - id: todo-closer
        name: close Todo trailer tasks
        entry: scripts/todo_hooks.sh closer
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false

      - id: todo-import-pr-merge
        name: import PR Todo sections (pull)
        entry: scripts/todo_hooks.sh import-pr post-merge
        language: system
        stages: [post-merge]
        always_run: true
        pass_filenames: false

      - id: todo-import-pr-rewrite
        name: import PR Todo sections (pull --rebase)
        entry: scripts/todo_hooks.sh import-pr post-rewrite
        language: system
        stages: [post-rewrite]
        always_run: true
        pass_filenames: false

      # Every dependency on its ecosystem's newest STABLE release, exact-pinned
      # so the question is mechanically answerable at all.
      #
      # `files:` is what keeps this cheap: a commit touching only source makes
      # ZERO network requests, and manifest commits mostly hit a 6h disk cache.
      #
      # Runs WITHOUT --strict on purpose. Offline it degrades to the cached
      # answer and passes with a loud banner; `--no-verify` is banned here, so
      # a hook that hard-failed on a flaky connection would leave no way to
      # commit at all. The strict run is local only (CI does not check
      # freshness): scripts/check_dependency_freshness.sh --all --strict
      - id: dependency-freshness
        name: dependencies on newest stable
        entry: scripts/check_dependency_freshness.sh
        language: system
        pass_filenames: true
        files: >-
          (pubspec\.(yaml|lock)|pyproject\.toml|requirements.*\.txt|uv\.lock
          |package\.json|package-lock\.json|pnpm-lock\.yaml
          |Cargo\.(toml|lock)|go\.(mod|sum)
          |\.fvmrc|\.nvmrc|\.python-version
          |\.github/workflows/.*\.ya?ml)$

  - repo: local
    hooks:
      # The only pre-push hook. Everything that used to run here is now
      # `stages: [manual]` -- run on demand with `scripts/check_gate_stamp.sh
      # full`, and by CI on every push. finish_auto.sh stamps HEAD after its
      # gate; a tree without that receipt cannot leave the machine.
      - id: gate-stamp
        name: pushed tree passed the local gate (stamp check)
        entry: scripts/check_gate_stamp.sh check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
